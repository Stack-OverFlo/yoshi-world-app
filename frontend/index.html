<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoshi World</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="hero">
        <div class="container">
            <h1>🥚 Yoshi World 🥚</h1>
            <p>Welcome to Yoshi's world!</p>
        </div>
    </header>

    <main class="container">
        <section class="welcome">
            <h2>Yoshis</h2>
            <p>
                Discover and manage Yoshis
            </p>
        </section>
        <section class="yoshi-manager">
            <div class="form-card">
                <h2 id="form-title">
                    Add a Yoshi
                </h2>
                <form id="yoshi-form">
                    <label for="yoshi-name">
                        Name
                    </label>
                    <input
                        id="yoshi-name"
                        type="text"
                        placeholder="Ex: Green Yoshi"
                        maxlength="100"
                        required>
                    <label for="yoshi-color">
                        Color
                    </label>
                    <input
                        id="yoshi-color"
                        type="text"
                        placeholder="Ex: green"
                        maxlength="50"
                        required>
                    <div class="form-actions">
                        <button
                            type="submit"
                            class="primary-button">
                            Save
                        </button>
                        <button
                            type="button"
                            id="cancel-button"
                            class="secondary-button"
                            hidden>
                            Cancel
                        </button>
                    </div>
                </form>
            </div>
            <section
                id="yoshi-list"
                class="yoshi-list">
                <p>Loading Yoshis...</p>
            </section>
        </section>
    </main>
    <footer>
        <p>
            Yoshi World — Powered by Podman 🐢
        </p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
