server {
    listen 80;
    server_name _;

    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
	
    location /images/ {
	    alias /usr/share/nginx/html/images/;
	    try_files $uri =404; }

    location /api/ {
        proxy_pass http://yoshi-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
